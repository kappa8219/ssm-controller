apiVersion: ssm.services.k8s.aws/v1alpha1
kind: Document
metadata:
  name: $NAME
spec:
  name: $NAME
  documentType: Command
  documentFormat: JSON
  tags:
  - key: ack-e2e-document-tag
    value: initial
  content: |
    {
      "schemaVersion": "2.2",
      "description": "Sample SSM Document",
      "mainSteps": [
        {
          "action": "aws:runShellScript",
          "name": "example",
          "inputs": {
            "runCommand": ["echo Hello, World!"]
          }
        }
      ]
    }
